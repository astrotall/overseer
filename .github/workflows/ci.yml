name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: overseer
          POSTGRES_PASSWORD: overseer
          POSTGRES_DB: overseer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U overseer -d overseer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://overseer:overseer@localhost:5432/overseer
      DATABASE_URL_TEST: postgresql+asyncpg://overseer:overseer@localhost:5432/overseer_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --dev

      - name: Ruff — lint
        run: uv run ruff check .

      - name: Ruff — format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy apps libs

      - name: Alembic — upgrade head
        run: uv run alembic upgrade head

      - name: Create test database
        env:
          PGPASSWORD: overseer
        run: psql -h localhost -U overseer -d overseer -c 'CREATE DATABASE overseer_test'

      - name: Pytest
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
