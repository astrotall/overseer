name: overseer

services:
  postgres:
    image: postgres:16-alpine
    container_name: overseer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-overseer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-overseer}
      POSTGRES_DB: ${POSTGRES_DB:-overseer}
    # Порты инфраструктуры публикуются только на loopback хоста: без IP Docker
    # открывает их на всех интерфейсах, то есть всей локальной сети (OVE-59).
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-overseer} -d ${POSTGRES_DB:-overseer}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: overseer-redis
    restart: unless-stopped
    # Пароль обязателен (OVE-59). requirepass передаётся конфигом через stdin
    # («redis-server -»), а не аргументом: аргументы процесса видны в ps хоста.
    # exec docker-entrypoint.sh сохраняет штатный сброс прав до пользователя redis.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-overseer}
    command:
      - sh
      - -c
      - |
        exec docker-entrypoint.sh redis-server - --appendonly yes <<EOF
        requirepass $$REDIS_PASSWORD
        EOF
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    volumes:
      - redisdata:/data
    # redis-cli выходит с кодом 0 и на NOAUTH, поэтому проверяется сам ответ PONG.
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: overseer-api
    restart: unless-stopped
    # Песочница Chromium поднимает пользовательские namespace'ы, а дефолтный
    # seccomp-профиль Docker их запрещает. Профиль ниже — тот же дефолт плюс
    # clone/setns/unshare; без него Chromium откажется стартовать (и это лучше,
    # чем стартовать без песочницы). Подробности — architecture-browser.md.
    security_opt:
      - seccomp=./chromium-seccomp.json
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-overseer}:${POSTGRES_PASSWORD:-overseer}@postgres:5432/${POSTGRES_DB:-overseer}
      REDIS_URL: redis://default:${REDIS_PASSWORD:-overseer}@redis:6379/0
      ENV: ${ENV:-local}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: overseer-worker
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-overseer}:${POSTGRES_PASSWORD:-overseer}@postgres:5432/${POSTGRES_DB:-overseer}
      REDIS_URL: redis://default:${REDIS_PASSWORD:-overseer}@redis:6379/0
      ENV: ${ENV:-local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
